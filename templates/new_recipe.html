{% extends "layout.html" %}

{% block title %}Uusi resepti{% endblock %}

{% block content %}
<h2>Uusi resepti</h2>
<form action="/create_recipe" method="post">
  <p>
    Nimi: <br />
    <input type="text" name="title" value="{{ filled.title }}" maxlength="100" required />
  </p>
  {% for title in classes %}
  <p>
    {{ title }}: <br />
    <select name="classes">
      <option value="">(valitse)</option>
      {% for value in classes[title] %}
      {% if filled.classes and filled.classes[title] == value %}
      <option value="{{ title }}:{{ value }}" selected>{{ value }}</option>
      {% else %}
      <option value="{{ title }}:{{ value }}">{{ value }}</option>
      {% endif %}
      {% endfor %}
    </select>
  </p>
  {% endfor %}
  <p>
    Ainekset: <br />
    <textarea name="ingredients" rows="8" cols="60" maxlength="2000" required>{{ filled.ingredients }}</textarea>
  </p>
  <p>
    Valmistusohje: <br />
    <textarea name="instructions" rows="8" cols="60" maxlength="5000" required>{{ filled.instructions }}</textarea>
  </p>
  <input type="submit" value="Lisää resepti" />
</form>
{% endblock %}
