<!DOCTYPE html>
<html>

<head>
  <title>Keittokirja</title>
</head>

<body>
  <h1>Keittokirja</h1>
  {% if session.user_id %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}
  </p>
  <p>
    <a href="/new_recipe">Lisää resepti</a> |
    <a href="/logout">Kirjaudu ulos</a>
  </p>
  {% else %}
  <p>
    <a href="/login">Kirjaudu sisään</a> |
    <a href="/register">Luo tunnus</a>
  </p>
  {% endif %}
  <p>Tervetuloa Keittokirjaan!</p>
  <h2>Reseptit</h2>
  <ul>
    {% for recipe in recipes %}
    <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
    {% endfor %}
  </ul>
</body>

</html>
