{% extends "layout.html" %}

{% block title %}{{ user.username }}{% endblock %}

{% block content %}
<h2>Käyttäjä {{ user.username }}</h2>
<p>
  Reseptejä yhteensä: {{ recipe_count }}
</p>
<h3>Käyttäjän reseptit</h3>
<ul>
  {% for recipe in recipes %}
  <li><a href="/recipe/{{ recipe.id }}">{{ recipe.title }}</a></li>
  {% endfor %}
</ul>
{% endblock %}
